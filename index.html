<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental App</title>
    <style>
        body {
            align-items: center;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }
        main {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            max-width: 440px;
            padding: 32px;
        }
        h1 { margin-top: 0; }
        a {
            background: #2563eb;
            border-radius: 6px;
            color: #ffffff;
            display: inline-block;
            padding: 12px 20px;
            text-decoration: none;
        }
        p { color: #64748b; line-height: 1.5; }
        code { background: #f1f5f9; padding: 2px 5px; }
    </style>
</head>
<body>
    <main>
        <h1>Vehicle Rental App</h1>
        <p>Start the server first, then click below to open the website.</p>
        <p>Run <code>compile_and_run.bat</code> in the project folder.</p>
        <a href="http://localhost:8080/">Open Website</a>
    </main>
</body>
</html>
